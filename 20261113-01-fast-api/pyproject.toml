[project]
name = "fast-api-20261113"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "google-genai>=3.3.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.8.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
