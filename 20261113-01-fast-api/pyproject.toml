[project]
name = "fast-api-20261113"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic>=2.14.3",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
