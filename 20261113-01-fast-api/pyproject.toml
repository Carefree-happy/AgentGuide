[project]
name = "fast-api-20261113"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bashkit[deepagents]>=0.21.0",
    "certifi>=2026.10.23",
    "deepagents>=0.7.38",
    "fastapi[standard]",
    "google-genai>=3.3.0",
    "httpx[socks]>=0.28.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
