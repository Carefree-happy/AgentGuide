[project]
name = "langchain-20261115"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "httpx[socks]>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
